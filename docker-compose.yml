services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibeathon}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-vibeathon}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vibeathon

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibeathon}
      POSTGRES_USER: ${POSTGRES_USER:-vibeathon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibeathon} -d ${POSTGRES_DB:-vibeathon}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vibeathon

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibeathon}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-vibeathon}
    command: ["npm", "run", "db:setup"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vibeathon

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["production"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - vibeathon

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  vibeathon:
